name: Deploy Lingosaic

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      LINGOSAIC_SITE_URL: https://www.lingosaic.com/
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run prepare:daily
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
